<svg xmlns="http://www.w3.org/2000/svg" viewBox="355 340 1190 1190" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dokuwu</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5073"/>
      <stop offset="1" stop-color="#394d6d"/>
    </linearGradient>

    <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2486d0"/>
      <stop offset=".45" stop-color="#1f5cc0"/>
      <stop offset="1" stop-color="#101f8a"/>
    </linearGradient>
    <linearGradient id="backTop" x1="497" y1="0" x2="1115" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c2dc"/>
      <stop offset=".6" stop-color="#1fb4d0"/>
      <stop offset="1" stop-color="#18b4b0"/>
    </linearGradient>
    <linearGradient id="backTopV" x1="0" y1="385" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22c8dc" stop-opacity=".95"/><stop offset=".25" stop-color="#20bcd4" stop-opacity=".85"/><stop offset=".5" stop-color="#22a8d8" stop-opacity=".2"/><stop offset=".75" stop-color="#22a8d8" stop-opacity="0"/></linearGradient>
    <linearGradient id="rollShade" x1="0" y1="900" x2="0" y2="1480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d1a82" stop-opacity="0"/><stop offset=".5" stop-color="#0d1a82" stop-opacity=".5"/><stop offset="1" stop-color="#0d1a82" stop-opacity=".6"/></linearGradient>
    <linearGradient id="backShade"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="backEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd0e6"/>
      <stop offset="1" stop-color="#2bd0e6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="frontV" x1="0" y1="490" x2="0" y2="1490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aeeee"/>
      <stop offset=".3" stop-color="#b0ecf0"/>
      <stop offset=".55" stop-color="#62b4e6"/>
      <stop offset=".8" stop-color="#3f84e0"/>
      <stop offset="1" stop-color="#3a62d8"/>
    </linearGradient>
    <radialGradient id="frontTeal" cx="1400" cy="880" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fd8c8" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#2fd8c8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2fd8c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frontBR" cx="1380" cy="1330" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28a6d8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#28a6d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frontBL" cx="700" cy="1470" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a5ee0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4a5ee0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="625" y1="490" x2="700" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flapGrad" x1="1115" y1="400" x2="1330" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bdeff4"/>
      <stop offset=".5" stop-color="#d4f7f8"/>
      <stop offset="1" stop-color="#9ee6ee"/>
    </linearGradient>

    <linearGradient id="armL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27b4d2"/>
      <stop offset=".6" stop-color="#2da0d6"/>
      <stop offset="1" stop-color="#5a7ee8"/>
    </linearGradient>
    <radialGradient id="armR" cx="1490" cy="900" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee8d0"/>
      <stop offset=".6" stop-color="#34d0c6"/>
      <stop offset="1" stop-color="#27a8d4"/>
    </radialGradient>
    <linearGradient id="armRb" x1="1540" y1="900" x2="1405" y2="1090" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ed8c8"/>
      <stop offset="1" stop-color="#2a9ed2"/>
    </linearGradient>
    <linearGradient id="legL" x1="750" y1="1580" x2="915" y2="1480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a6ef0"/>
      <stop offset="1" stop-color="#2a8ad8"/>
    </linearGradient>
    <linearGradient id="legR" x1="1070" y1="1550" x2="1228" y2="1450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d78dc"/>
      <stop offset="1" stop-color="#2cb8d2"/>
    </linearGradient>

    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ef0e4"/>
      <stop offset="1" stop-color="#6df0f2"/>
    </linearGradient>

    <filter id="blurCheek" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softWide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="frontClip">
      <path id="frontShape" d="M625 592 Q625 490 730 490 L1115 487 L1405 680 L1405 1325 Q1405 1425 1305 1436 L650 1490 Q625 1490 625 1465 Z"/>
    </clipPath>
  </defs>

  <!-- latar -->

  <!-- lembar belakang (sisi dalam gulungan) -->
  <path d="M497 462 Q497 385 578 385 L1115 385 L1125 640 L625 640 L625 1432 Q612 1490 556 1490 Q497 1484 497 1398 Z" fill="url(#backGrad)"/>
  <path d="M497 462 Q497 385 578 385 L1115 385 L1125 640 L625 640 L625 1432 Q612 1490 556 1490 Q497 1484 497 1398 Z" fill="url(#backTopV)"/>
  <path d="M510 470 Q512 398 580 398" fill="none" stroke="#5fe4f2" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M497 462 L497 1398" stroke="url(#backEdge)" stroke-width="0"/>
  <!-- gulungan bawah kiri -->
  <path d="M512 900 L512 1395 Q514 1470 566 1474 Q612 1470 625 1420 L625 900 Z" fill="url(#rollShade)"/>
  <path d="M540 1475 Q618 1480 650 1440" fill="none" stroke="#4a6cf0" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <!-- bayangan halaman depan di lembar belakang -->
  <path d="M470 500 L625 500 L625 1432 L470 1432 Z" fill="url(#backShade)" opacity="0"/>

  <!-- halaman depan -->
  <g>
    <use href="#frontShape" fill="url(#frontV)"/>
    <g clip-path="url(#frontClip)">
      <rect x="600" y="480" width="830" height="1030" fill="url(#frontTeal)"/>
      <rect x="600" y="480" width="830" height="1030" fill="url(#frontBR)"/>
      <rect x="600" y="480" width="830" height="1030" fill="url(#frontBL)"/>
      <!-- kilau tepi atas-kiri -->
      <path d="M634 1000 L634 600 Q634 500 735 499 L1110 496" fill="none" stroke="url(#rim)" stroke-width="22" stroke-linecap="round"/>
      <!-- tepi bawah/kanan: lipatan bingkai dalam -->
      <path d="M1352 700 L1352 1315 Q1352 1372 1295 1378 L665 1432" fill="none" stroke="#6fc0f4" stroke-opacity=".35" stroke-width="5"/>
      <path d="M1405 1325 Q1405 1425 1305 1436 L650 1490" fill="none" stroke="#2f5fd0" stroke-opacity=".5" stroke-width="10"/>
    </g>
  </g>

  <!-- bayangan lipatan sudut -->
  <path d="M1115 487 L1405 680 L1280 780 Q1130 790 1115 600 Z" fill="#1c6aa8" opacity=".35" filter="url(#soft)"/>

  <!-- sudut terlipat -->
  <path d="M1115 385 L1405 680 L1232 688 Q1126 684 1124 588 Z" fill="url(#flapGrad)"/>
  <path d="M1124 588 Q1126 684 1232 688 L1405 680" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1115 385 L1124 588" stroke="#7ad4e8" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/>

  <!-- pipi -->
  <ellipse cx="775" cy="975" rx="52" ry="38" fill="#3f8cf0" opacity=".75" filter="url(#blurCheek)"/>
  <ellipse cx="1218" cy="935" rx="70" ry="44" fill="#2fd6c4" opacity=".6" filter="url(#blurCheek)"/>

  <!-- wajah -->
  <g fill="none" stroke="#1d2a58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M786 904 Q786 856 842 856 Q896 856 896 904" stroke-width="34"/>
    <path d="M1136 884 Q1136 833 1190 833 Q1244 833 1244 884" stroke-width="34"/>
    <path d="M961 925 Q965 950 988 950 Q1008 950 1015 922 Q1024 950 1045 950 Q1067 948 1072 922" stroke-width="22"/>
  </g>
  <!-- kilau mata -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-linecap="round">
    <path d="M790 914 Q792 868 842 866" stroke-width="3" transform="translate(0 4)"/>
  </g>

</svg>
