[package]
name = "dokuwu-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"
description = "Shared native engine for Dokuwu features, called from Tauri commands."

[lib]
name = "dokuwu_core"

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "bmp", "tiff"] }
jpeg-encoder = "0.6"
# MuPDF reads the PDF (text with fonts and positions, images, vector lines) and
# opens it lazily for Compress PDF. AGPL-3.0, accepted for Dokuwu. base14-fonts
# keeps text set in the standard PDF fonts (Helvetica, Times, ...).
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
png = "0.18"
regex = "1"
# QR matrix only: the crate's own image and SVG writers are not used.
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
thiserror = "2"
ttf-parser = "0.25"
unicode-normalization = "0.1"
log = "0.4"
unicode-properties = "0.1"
uuid = { version = "1", features = ["v4"] }
webp = { version = "0.3.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Atomic replace with write-through, and the session store lock.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Reads generated QR codes and barcodes back, to prove they scan.
rxing = { version = "0.9", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }
tempfile = "3"
zip = { version = "9.0.5", default-features = false }
